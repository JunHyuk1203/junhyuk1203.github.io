### 원인
1. **전역 변수(`atOptions`) 충돌**: 배너 광고 스크립트는 `atOptions`라는 동일한 전역 변수를 공유하므로, 한 페이지에 여러 번 작성하면 나중에 선언된 설정값이 이전 설정을 덮어쓰게 됩니다.
2. **동일한 `id` 중복**: 네이티브 광고 컨테이너 태그인 `<div id="container-7857d684feb24931f72c06ff0040db33"></div>`의 `id` 값이 중복되면, 브라우저는 가장 먼저 만나는 첫 번째 요소에만 광고를 출력합니다.
3. **`iframe` 격리 필요성**: 동일 네트워크의 광고를 한 페이지에 여러 개 노출하려면 각 광고를 독립된 `iframe`으로 격리해야 변수 및 DOM `id` 충돌 없이 각각 정상 로드됩니다.
